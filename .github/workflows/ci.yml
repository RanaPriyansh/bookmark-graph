name: CI

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests with pytest
      run: |
        pytest -v --cov=bookmark_graph --cov-report=term-missing
    
    - name: Verify tests fail on broken code
      run: |
        # Ensure pytest would catch real failures
        echo "✓ Tests passed - CI will fail if pytest fails"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Check code formatting
      run: |
        pip install black
        black --check bookmark_graph/ tests/ || true
    
    - name: Verify installation
      run: |
        pip install -e .
        bookmark-graph --version
